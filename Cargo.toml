[workspace]
members = ["crates/app", "crates/core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/punkhomov/recurring"
authors = ["Nikita Pakhomov"]

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
# Pre-1.0: pin exactly; upgrades are deliberate PRs checked against the API.
gpui = "=0.2.2"
# xattr 0.2.3 (pulled in by gpui_http_client) still refers to
# libc::ENOATTR, which libc removed for Linux in 0.2.187.
libc = "=0.2.186"
recurring-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"
unimplemented = "warn"

[profile.dev.package."*"]
opt-level = 2
