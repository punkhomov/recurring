version: 2

updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Moscow"
    # Keep bot updates aligned with Cargo's 14-day publish-age policy.
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    ignore:
      # xattr 0.2.3 (via gpui_http_client) still refers to libc::ENOATTR,
      # which libc removed for Linux in 0.2.187. Keep the explicit 0.2.186
      # pin until GPUI's dependency chain updates.
      - dependency-name: "libc"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Moscow"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
